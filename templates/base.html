<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        select {
            padding: 6px;
            width: 250px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 6px 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            color: #2196F3;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* index.html 用のスタイル */
        ul {
            padding: 0;
            list-style: none;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .overdue {
            color: red;
            font-weight: bold;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        .btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        .btn-toggle {
            background-color: #4CAF50;
            color: white;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
        }

        .btn-edit {
            background-color: #2196F3;
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

</body>
</html>
